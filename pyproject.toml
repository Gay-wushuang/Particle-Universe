[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "particle-universe"
version = "0.1.0"
description = "Minimal NumPy Lennard-Jones NVE solver"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[tool.setuptools]
packages = ["particle_universe"]
